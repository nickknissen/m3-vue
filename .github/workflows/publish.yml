# Publish to npm when a version tag (v0.9.0, …) is pushed. Renovate then opens a PR in ErgScan
# and garmin-dashboard that moves to it, lockfile and all. It couldn't update the lockfile for a
# git dependency: Renovate's npm refuses to fetch git packages (EALLOWGIT).
#
# Trusted publishing: npm trusts this workflow, so there's no npm token in the repo's secrets.
# Set it up once on npmjs.com → @nickknissen/m3-vue → Settings → Trusted publisher: GitHub Actions,
# nickknissen/m3-vue, workflow publish.yml.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag is package.json's version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but package.json says $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm publish --provenance --access public
